<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descarga tu carnet CiberHéroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  .dl-wrap{ max-width:420px; margin:0 auto; padding:40px 20px 60px; text-align:center; position:relative; z-index:1; }
  .dl-card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px; box-shadow:var(--shadow); }
  .dl-card h1{ font-family:'Bangers',cursive; font-size:26px; letter-spacing:1px; color:var(--accent); margin:0 0 6px; }
  .dl-card p{ color:var(--ink-dim); font-size:13px; line-height:1.5; margin:0 0 18px; }
  .dl-frame{ background:#fff; border-radius:10px; padding:10px; margin-bottom:20px; }
  .dl-frame img{ width:100%; border-radius:6px; display:block; }
  .dl-btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    font-family:'Rubik',sans-serif; font-weight:800; font-size:15px; color:#101225;
    background:var(--accent); border:none; padding:15px 18px; border-radius:10px;
    text-decoration:none; cursor:pointer; transition:.15s;
  }
  .dl-btn:hover{ filter:brightness(1.07); transform:translateY(-1px); }
  .dl-btn svg{ width:18px; height:18px; }
  .dl-status{ font-size:11.5px; color:var(--ink-dim); margin-top:14px; line-height:1.5; }
  .dl-error{ background:rgba(255,77,94,.1); border:1px solid rgba(255,77,94,.4); color:#ffb3ba; font-size:13px; padding:14px; border-radius:10px; }
</style>
</head>
<body>
<div class="halftone"></div>
<div class="dl-wrap">
  <div class="dl-card" id="dlCard">
    <h1>CARNET CIBERHÉROES</h1>
    <p>Estamos preparando la descarga de tu carnet...</p>
    <div id="dlContent"></div>
  </div>
</div>

<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const imgUrl = params.get('img');
  const fileName = params.get('name') || 'carnet.png';
  const content = document.getElementById('dlContent');

  if(!imgUrl){
    content.innerHTML = '<div class="dl-error">No se encontró la imagen del carnet. Vuelve a escanear el código QR.</div>';
    return;
  }

  content.innerHTML = `
    <div class="dl-frame"><img src="${imgUrl}" alt="Tu carnet"></div>
    <a class="dl-btn" id="dlBtn" href="${imgUrl}" download="${fileName}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      Descárgalo aquí
    </a>
    <div class="dl-status">Si la descarga no comienza sola, toca el botón de arriba para guardar la imagen en tu teléfono.</div>
  `;

  // Intento de descarga automática. Solo funciona de forma completa cuando
  // el navegador respeta el atributo "download" para este origen; si no lo
  // hace (recursos de otro dominio), el botón visible de arriba sigue
  // disponible como respaldo garantizado.
  try{
    const auto = document.createElement('a');
    auto.href = imgUrl;
    auto.download = fileName;
    auto.rel = 'noopener';
    document.body.appendChild(auto);
    auto.click();
    auto.remove();
  }catch(e){
    // Si falla el intento automático, no pasa nada: el botón visible cubre el caso.
  }
})();
</script>
</body>
</html>
