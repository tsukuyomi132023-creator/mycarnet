<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenido a la Legión Cibernética</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1220; --bg2:#171b30; --panel:#1b2036; --line:#2c3352;
    --ink:#eef0fb; --ink-dim:#9aa1c4; --accent:#ffce3d; --accent2:#ff4d5e; --accent3:#3ddc97;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:28px 16px;
    background:
      radial-gradient(circle at 12px 12px, rgba(255,255,255,.05) 1.5px, transparent 1.6px) 0 0/24px 24px,
      linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
    color:var(--ink); font-family:'Rubik',system-ui,sans-serif;
  }
  .card{
    width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line);
    border-radius:18px; padding:28px 24px 26px; text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
  }
  .kicker{
    display:inline-block; font-family:'Roboto Mono',monospace; font-weight:700; font-size:10.5px;
    letter-spacing:2.5px; color:var(--accent3); background:rgba(61,220,151,.08);
    border:1px solid rgba(61,220,151,.3); padding:5px 11px; border-radius:100px; margin-bottom:14px;
  }
  h1{
    font-family:'Bangers',cursive; font-size:clamp(28px,7vw,38px); letter-spacing:1.5px; margin:0 0 6px; line-height:1.05;
    background:linear-gradient(180deg,#fff 10%,var(--accent) 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  p.sub{ color:var(--ink-dim); font-size:14.5px; line-height:1.5; margin:0 0 22px; }
  .img-frame{
    background:#fff; border-radius:12px; padding:10px; margin-bottom:20px;
    border:1px solid var(--line); min-height:120px; display:flex; align-items:center; justify-content:center;
  }
  .img-frame img{ display:block; width:100%; border-radius:6px; }
  .status{ font-size:13px; color:var(--ink-dim); }
  .status.error{ color:var(--accent2); }
  .btn{
    font-family:'Rubik',sans-serif; font-weight:700; font-size:14.5px; padding:13px 20px; border-radius:10px;
    border:none; cursor:pointer; width:100%; display:inline-flex; align-items:center; justify-content:center; gap:9px;
    background:var(--accent); color:#101225; text-decoration:none; transition:.15s;
  }
  .btn:hover{ filter:brightness(1.06); }
  .btn:disabled{ opacity:.55; cursor:not-allowed; }
  .btn svg{ width:18px; height:18px; }
  .foot{ margin-top:16px; font-size:11.5px; color:var(--ink-dim); }
</style>
</head>
<body>
  <div class="card">
    <span class="kicker">★ ACADEMIA DE CIBERSEGURIDAD ★</span>
    <h1>¡Enhorabuena!</h1>
    <p class="sub">Ahora eres parte de la Legión Cibernética.</p>

    <div class="img-frame" id="imgFrame">
      <span class="status" id="statusMsg">Cargando tu carnet…</span>
    </div>

    <button class="btn" id="btnDownload" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      Descargar carnet
    </button>

    <div class="foot">Guarda esta imagen para tener tu identificación siempre a mano.</div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const imgUrl = params.get('img');
  const fileName = params.get('name') || 'carnet.png';

  const imgFrame = document.getElementById('imgFrame');
  const statusMsg = document.getElementById('statusMsg');
  const btnDownload = document.getElementById('btnDownload');

  if(!imgUrl){
    statusMsg.textContent = 'No se encontró ningún carnet para mostrar.';
    statusMsg.classList.add('error');
  } else {
    const img = new Image();
    img.alt = 'Tu carnet de ciberhéroe';
    img.onload = () => {
      imgFrame.innerHTML = '';
      imgFrame.appendChild(img);
      btnDownload.disabled = false;
    };
    img.onerror = () => {
      statusMsg.textContent = 'No se pudo cargar la imagen del carnet.';
      statusMsg.classList.add('error');
    };
    img.src = imgUrl;
  }

  btnDownload.addEventListener('click', async () => {
    if(!imgUrl) return;
    const original = btnDownload.innerHTML;
    btnDownload.disabled = true;
    btnDownload.textContent = 'Descargando…';
    try{
      const res = await fetch(imgUrl, { mode:'cors' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl; a.download = fileName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
    }catch(err){
      // Si la descarga directa falla (por ejemplo por CORS), abrimos la imagen
      // en una pestaña nueva para que el usuario la guarde manualmente.
      window.open(imgUrl, '_blank', 'noopener');
    }finally{
      btnDownload.disabled = false;
      btnDownload.innerHTML = original;
    }
  });
</script>
</body>
</html>
